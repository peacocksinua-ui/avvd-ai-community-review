name: sync discussions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-discussions-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run sync script
        run: npm run sync

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          # Check if there are changes to commit
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync discussions data"
          fi
          
          # Retry push with rebase up to 5 times
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; true; }
            
            if git push origin main; then
              echo "✓ Successfully pushed changes"
              exit 0
            fi
            
            if [ $i -lt 5 ]; then
              echo "Push attempt $i failed, retrying in 1 second..."
              sleep 1
            fi
          done
          
          echo "✗ Error: Failed to push changes after 5 attempts"
          exit 1
