name: Sync Discussions to JSON

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-discussions
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-discussions.js

      - name: Upload generated JSON
        uses: actions/upload-artifact@v4
        with:
          name: discussions-json
          path: data/discussions.json
