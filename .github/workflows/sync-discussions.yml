name: sync discussions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-discussions-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run sync script
        run: npm run sync

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: sync discussions data" || exit 0

          # Спочатку завжди робимо pull перед push
          git fetch origin main
          git rebase origin/main || git rebase --abort
          
          for i in 1 2 3; do
            if git push origin main; then
              echo "✓ Зміни успішно залиштовані"
              exit 0
            fi
            echo "Спроба $i невдала, чекаємо 2 секунди..."
            sleep 2
            git fetch origin main
            git rebase origin/main || git rebase --abort
          done

          echo "✗ Помилка: не вдалось залиштовати зміни після 3 спроб"
          exit 1
          exit 1
